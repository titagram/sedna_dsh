[project]
name = "sedna"
version = "0.2.0"
description = "HTB/penetration testing plugin for Hades — tool wrappers, evidence collection, knowledge base"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Gabriele", email = "gabriele@local" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "markdown-it-py>=3.0,<4",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "typer==0.16.0",
    "rich==13.9.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24",
    "ruff==0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sedna"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "I001"]  # Plugin bootstrap side-effect imports

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
markers = [
    "e2e: end-to-end tests requiring live targets",
    "integration: tests requiring Docker/services",
]
