name: verify-seed

# The gate.  This repository publishes memory: if a captured flag, a key or a
# credential-shaped literal ever enters seed/, it must fail here rather than on
# somebody's clone.
#
# Three checks, in increasing order of specificity:
#   1. the scanner's own test suite (the gate must work on the poisoned fixtures),
#   2. the manifest matches the artifacts (the committed backup is the one described),
#   3. no BLOCK-class literal anywhere in seed/, engine/, plugin/, tools/, docs/.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runner ships Node 22; DSH needs >= 24.2 (it uses import.meta.main), so the
      # installer's own prerequisite check fails without this -- which is how the first
      # push went red.  Installing the version the project documents is the fix; relaxing
      # the check would have been the wrong one.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The same script a contributor runs locally, so "it passes here" means something.
      - name: All checks
        run: bash tests/run-all.sh


  # The two platforms this stack claims and this machine cannot run. Docker Desktop is not
  # available on GitHub's macOS runners and Linux containers do not run on Windows runners, so
  # the full stack cannot be exercised here. What can be is everything a user meets *before* a
  # container starts: the shell they have, the bytes git gave them, and how the installer behaves
  # on a machine without Docker. That is a smaller claim than "it runs there", and it is measured
  # instead of argued -- which is the difference this repository has been paying attention to.
  host:
    name: host scripts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: What this machine actually provides
        shell: bash
        run: |
          printf 'shell: %s\n' "$(bash --version | head -1)"
          printf 'host:  %s %s\n' "$(uname -s)" "$(uname -m)"

      # GitHub's Windows runners run bash as Git Bash, which is what a Windows user has. On
      # macOS the interesting fact is that /bin/bash is 3.2.57 and has been since 2007, so the
      # scripts are checked against that exact interpreter rather than against a Homebrew bash
      # that might be earlier in PATH.
      - name: The shell macOS ships, on macOS itself
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/bash --version | head -1
          for f in install.sh compose/*.sh; do /bin/bash -n "$f" || exit 1; done
          echo "every host script parses under the bash macOS actually has"

      # Reproducing the condition rather than trusting the rule. A Windows user with the Git for
      # Windows default (core.autocrlf=true) receives a working tree this repository must not
      # have: the .env.example line-ending bug in this project's history was invisible on Linux
      # and would have delivered every value with a trailing \r. Re-materialising the tree with
      # that setting is what turns the .gitattributes rule into something tested.
      - name: The checkout a Windows user with autocrlf=true receives
        shell: bash
        run: |
          git config core.autocrlf true
          git rm -r --cached . >/dev/null 2>&1
          git reset --hard >/dev/null 2>&1
          cr="$(printf '\r')"
          if LC_ALL=C grep -ql "$cr" install.sh compose/.env.example; then
            echo "::error::a shipped script or value file arrived with CRLF"; exit 1
          fi
          echo "pinned files are LF even with autocrlf=true"

      - name: The installer on a machine without Docker
        shell: bash
        run: |
          out="$(bash install.sh --dry-run 2>&1 || true)"
          printf '%s\n' "$out" | head -12
          case "$out" in
            *"dry run finished"*) echo "completed -- Docker is present on this runner" ;;
            *ocker*)              echo "refused, and named Docker as the reason -- correct here" ;;
            *) echo "::error::install.sh neither ran nor explained why"; exit 1 ;;
          esac

      - name: Host-script portability
        shell: bash
        run: bash tests/test_portability.sh


  # Native arm64, not emulated: the container layer on an arm64 machine, which is the half of the
  # arm64 claim QEMU could never make. The seed's Hindsight import takes about 35 minutes and does
  # not fit in CI, so the knowledge base is unpacked straight from the seed and used as it is: the
  # engine, the index and the retrieval run on real arm64, the bank import does not.
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: What this machine actually is
        run: |
          uname -m
          docker version --format 'server: {{.Server.Arch}}'

      # The first run of this job failed at the build and the log is not readable without admin
      # rights, so the job now says out loud what it has and what the compose file needs. The
      # difference from the build that succeeds on the development machine was the .env file the
      # compose file reads: a checkout has none, and the variables it interpolates are not all
      # defaulted.
      - name: Prepare what the compose file reads
        working-directory: compose
        env:
          DSH_PORT: "13080"
          HINDSIGHT_PORT: "19177"
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: |
          cp .env.example .env
          df -h / | tail -1
          free -m | head -2
          nproc

      - name: Build the DSH image here
        working-directory: compose
        env:
          DSH_PORT: "13080"
          HINDSIGHT_PORT: "19177"
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: docker compose build dsh

      - name: The engine, on arm64, against a knowledge base
        run: |
          set -uo pipefail

          # The job's log is unreadable without admin rights, so a failure is published through a
          # channel that is not: the annotation API, which the ::error:: lines below feed. A check
          # nobody can read the output of is a check that reports "failed" and nothing else.
          dump() {
            for f in "$@"; do
              [ -f "$f" ] || continue
              head -c 300 "$f" | tr -d '\r' | sed "s|^|::error::$(basename "$f"): |"
            done
          }

          mkdir -p /tmp/kb
          tar xzf seed/sedna-kb.tar.gz -C /tmp/kb
          chmod 700 /tmp/kb

          # The engine validates that 700 by equality, so the container must run as the user that
          # owns the directory. Locally that matched by accident -- both uid 1000 -- and on the
          # runner it does not: the checkout is owned by 1001 while the image runs as node. This
          # step failed on the first run for exactly that, which is why --user is here.
          run_op() {
            docker run --rm -i --user "$(id -u):$(id -g)" -v /tmp/kb:/data/kb \
              --entrypoint /opt/sedna/venv/bin/python sedna-stack-dsh:latest /opt/sedna/driver.py
          }

          echo '{"op":"maintenance","args":{"operation":"audit"}}'   | run_op > /tmp/audit.json   || { dump /tmp/audit.json;   exit 1; }
          echo '{"op":"maintenance","args":{"operation":"rebuild"}}' | run_op > /tmp/rebuild.json || { dump /tmp/rebuild.json; exit 1; }
          echo '{"op":"retrieve","args":{"target":"10.10.14.5","authorization_state":"authorized","exact_targets":["10.10.14.5"],"query_terms":["privilege escalation"]}}' | run_op > /tmp/retrieve.json || { dump /tmp/retrieve.json; exit 1; }

          python3 - <<'PY' || { dump /tmp/audit.json /tmp/rebuild.json /tmp/retrieve.json; exit 1; }
          import json
          audit   = json.load(open("/tmp/audit.json"))["data"]["report"]
          rebuild = json.load(open("/tmp/rebuild.json"))["data"]["report"]
          lane    = json.load(open("/tmp/retrieve.json"))["data"]
          assert audit["succeeded"] and audit["canonical_source_count"] == 94, audit
          assert rebuild["succeeded"] and rebuild["indexed_artifact_count"] > 0, rebuild
          lanes = {k: len(lane.get(k) or []) for k in
                   ("references", "case_steps", "negative_cases", "decision_guidance")}
          assert sum(lanes.values()) > 0, lanes
          print("native arm64: %d canonical sources, %d artifacts indexed, lanes %s"
                % (audit["canonical_source_count"], rebuild["indexed_artifact_count"], lanes))
          PY

  macos-docker:
    runs-on: macos-latest
    # An experiment, aimed at the one claim this repository still cannot measure: the container
    # layer on macOS. Non-blocking on purpose -- a red job here must not make the verified state
    # look broken while the approach is still being found.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: What this machine actually is
        run: |
          uname -m
          docker version --format 'server: {{.Server.Arch}}'

      # The first run of this job failed at the build and the log is not readable without admin
      # rights, so the job now says out loud what it has and what the compose file needs. The
      # difference from the build that succeeds on the development machine was the .env file the
      # compose file reads: a checkout has none, and the variables it interpolates are not all
      # defaulted.
      - name: Prepare what the compose file reads
        working-directory: compose
        env:
          DSH_PORT: "13080"
          HINDSIGHT_PORT: "19177"
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: |
          cp .env.example .env
          df -h / | tail -1
          free -m | head -2
          nproc

      # Docker on a macOS runner, which GitHub does not offer: Colima boots a Linux VM. It is not
      # Docker Desktop -- file sharing and the bind-mount implementation differ -- so a pass here
      # narrows the macOS container gap rather than closing it, and this comment says so instead of
      # letting the job's name imply more.
      - name: Docker on this macOS runner
        run: |
          brew install colima docker docker-compose >/dev/null
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          colima start --cpu 2 --memory 4
          uname -m
          docker version --format 'server: {{.Server.Arch}}'

      - name: Build the DSH image here
        working-directory: compose
        env:
          DSH_PORT: "13080"
          HINDSIGHT_PORT: "19177"
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: docker compose build dsh

      - name: The engine, on arm64, against a knowledge base
        run: |
          set -uo pipefail

          # The job's log is unreadable without admin rights, so a failure is published through a
          # channel that is not: the annotation API, which the ::error:: lines below feed. A check
          # nobody can read the output of is a check that reports "failed" and nothing else.
          dump() {
            for f in "$@"; do
              [ -f "$f" ] || continue
              head -c 300 "$f" | tr -d '\r' | sed "s|^|::error::$(basename "$f"): |"
            done
          }

          mkdir -p /tmp/kb
          tar xzf seed/sedna-kb.tar.gz -C /tmp/kb
          chmod 700 /tmp/kb

          # The engine validates that 700 by equality, so the container must run as the user that
          # owns the directory. Locally that matched by accident -- both uid 1000 -- and on the
          # runner it does not: the checkout is owned by 1001 while the image runs as node. This
          # step failed on the first run for exactly that, which is why --user is here.
          run_op() {
            docker run --rm -i --user "$(id -u):$(id -g)" -v /tmp/kb:/data/kb \
              --entrypoint /opt/sedna/venv/bin/python sedna-stack-dsh:latest /opt/sedna/driver.py
          }

          echo '{"op":"maintenance","args":{"operation":"audit"}}'   | run_op > /tmp/audit.json   || { dump /tmp/audit.json;   exit 1; }
          echo '{"op":"maintenance","args":{"operation":"rebuild"}}' | run_op > /tmp/rebuild.json || { dump /tmp/rebuild.json; exit 1; }
          echo '{"op":"retrieve","args":{"target":"10.10.14.5","authorization_state":"authorized","exact_targets":["10.10.14.5"],"query_terms":["privilege escalation"]}}' | run_op > /tmp/retrieve.json || { dump /tmp/retrieve.json; exit 1; }

          python3 - <<'PY' || { dump /tmp/audit.json /tmp/rebuild.json /tmp/retrieve.json; exit 1; }
          import json
          audit   = json.load(open("/tmp/audit.json"))["data"]["report"]
          rebuild = json.load(open("/tmp/rebuild.json"))["data"]["report"]
          lane    = json.load(open("/tmp/retrieve.json"))["data"]
          assert audit["succeeded"] and audit["canonical_source_count"] == 94, audit
          assert rebuild["succeeded"] and rebuild["indexed_artifact_count"] > 0, rebuild
          lanes = {k: len(lane.get(k) or []) for k in
                   ("references", "case_steps", "negative_cases", "decision_guidance")}
          assert sum(lanes.values()) > 0, lanes
          print("native arm64: %d canonical sources, %d artifacts indexed, lanes %s"
                % (audit["canonical_source_count"], rebuild["indexed_artifact_count"], lanes))
          PY
