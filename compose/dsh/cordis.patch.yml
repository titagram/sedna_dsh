# Host composition patch for the containerised DSH.
#
# Two rows, both host-plane, because both must exist in every session:
#
#   * webserver — `dsh web` refuses `--host 0.0.0.0` (it is checked and rejected at startup),
#     so binding every interface *inside* the container is only possible here. Without it the
#     port mapping publishes a service that answers only on the container's loopback, which
#     looks exactly like a broken stack. The `??` expressions keep `--port` working.
#   * sedna-bridge — the five sedna_* tools. A tool plugin publishes no service, so it needs
#     no isolate realm and sits loose, the same way this machine's own patch mounts it.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- insert:
    - id: sedna-bridge
      name: "file:///opt/sedna/index.mjs"
